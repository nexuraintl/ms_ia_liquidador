# cloudbuild.yaml — PRODUCCION (prod-ia-liquidador)
#
# Lo usa SOLO el trigger 'trigger-prod-ia-liquidador' (proyecto produccion-functions), que
# se dispara con push a 'main' del espejo GitHub nexuraintl/ms_ia_liquidador. Ese push lo
# hace el job SyncGitHubMain de azure-pipelines.yml.
# qa y master NO usan este archivo: despliegan con cloudbuild-ado.yaml via WIF.
# No reemplazar con la version de master: la imagen debe ir a Artifact Registry
# (us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-images), no a gcr.io.

steps:
  - id: Build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-images/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-images/$_SERVICE_NAME:latest'
      - '.'

  - id: Push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-images/$_SERVICE_NAME'

  - id: Deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - '$_SERVICE_NAME'
      - '--platform=managed'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-images/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--quiet'

substitutions:
  _SERVICE_NAME: default
  _REGION: us-central1

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-images/$_SERVICE_NAME:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-images/$_SERVICE_NAME:latest'

options:
  logging: CLOUD_LOGGING_ONLY
